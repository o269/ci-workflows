name: Node CI (reusable)

# Shared CI workflow consumed by every Node/Next/Hono repo across the Oasis
# Studios + Omnia ecosystem. Closes audit CRITICAL-7 (no CI anywhere).
#
# Each caller repo's .github/workflows/ci.yml is ~10 lines:
#
#   name: CI
#   on:
#     push: { branches: [main] }
#     pull_request:
#   jobs:
#     ci:
#       uses: o269/ci-workflows/.github/workflows/node-ci.yml@main
#       with:
#         workdir: '.'
#         build-script: 'build'
#         package-manager: 'pnpm'  # or 'npm'
#       secrets: inherit

on:
  workflow_call:
    inputs:
      workdir:
        description: 'Working directory for the package (e.g. "apps/api" for monorepo subpaths).'
        type: string
        default: '.'
      node-version:
        description: 'Node version. Default 22.x.'
        type: string
        default: '22.x'
      package-manager:
        description: 'pnpm or npm. Default pnpm.'
        type: string
        default: 'pnpm'
      pnpm-version:
        description: 'pnpm major version (only used when package-manager=pnpm).'
        type: string
        default: '10'
      install-script:
        description: 'Override install command. Default chooses by package-manager.'
        type: string
        default: ''
      typecheck-script:
        description: 'Typecheck script name in package.json. Default `typecheck` (falls back to `tsc --noEmit`).'
        type: string
        default: 'typecheck'
      lint-script:
        description: 'Lint script name. Skip if empty.'
        type: string
        default: 'lint'
      build-script:
        description: 'Build script name. Skip if empty.'
        type: string
        default: 'build'
      test-script:
        description: 'Test script name. Skip if empty (test coverage is Phase 2).'
        type: string
        default: ''
      secret-scan:
        description: 'Run gitleaks secret scan. Default true.'
        type: boolean
        default: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for gitleaks against PR diff

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node (pnpm cache)
        if: inputs.package-manager == 'pnpm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          # No cache-dependency-path — relies on default lockfile search. If the
          # lockfile is missing, the action emits a warning but doesn't fail.

      - name: Setup Node (npm cache)
        if: inputs.package-manager == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: ${{ inputs.install-script != '' && inputs.install-script || 'pnpm install --no-frozen-lockfile' }}

      - name: Install (npm)
        if: inputs.package-manager == 'npm'
        run: ${{ inputs.install-script != '' && inputs.install-script || 'npm install --no-audit --no-fund' }}

      - name: Lint (pnpm)
        if: inputs.lint-script != '' && inputs.package-manager == 'pnpm'
        run: pnpm run ${{ inputs.lint-script }} --if-present

      - name: Lint (npm)
        if: inputs.lint-script != '' && inputs.package-manager == 'npm'
        run: npm run ${{ inputs.lint-script }} --if-present

      - name: Typecheck (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: |
          if pnpm run | grep -q "  ${{ inputs.typecheck-script }}$"; then
            pnpm run ${{ inputs.typecheck-script }}
          else
            pnpm exec tsc --noEmit || true
          fi

      - name: Typecheck (npm)
        if: inputs.package-manager == 'npm'
        run: |
          if npm run | grep -q "  ${{ inputs.typecheck-script }}$"; then
            npm run ${{ inputs.typecheck-script }}
          else
            npx tsc --noEmit || true
          fi

      - name: Build (pnpm)
        if: inputs.build-script != '' && inputs.package-manager == 'pnpm'
        run: pnpm run ${{ inputs.build-script }}
        env:
          ARCH_MAP_SRC: '/nonexistent/skip-on-ci'
          NEXT_TELEMETRY_DISABLED: '1'
          # Dummy build-time env so Next.js can prerender API routes that construct
          # a Supabase client at module top-level. These never reach runtime — Vercel
          # injects real values for production. Without them, `createClient(url, key)`
          # throws "supabaseUrl is required" during build's data-collection step.
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          SUPABASE_URL: 'https://placeholder.supabase.co'
          SUPABASE_ANON_KEY: 'placeholder-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-key'
          LEADS_SUPABASE_URL: 'https://placeholder.supabase.co'
          LEADS_SUPABASE_SERVICE_KEY: 'placeholder-service-key'
          NEXT_PUBLIC_KB_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_KB_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          KB_SUPABASE_SERVICE_KEY: 'placeholder-service-key'
          ANTHROPIC_API_KEY: 'placeholder-anthropic-key'
          INTUIT_CLIENT_ID: 'placeholder'
          INTUIT_CLIENT_SECRET: 'placeholder'
          INTUIT_REDIRECT_URI: 'http://localhost:3000/cb'
          ADMIN_PASSWORD: 'placeholder'
          QUICKBASE_USER_TOKEN: 'placeholder'
          AUTH_PASSWORD_HASH: 'placeholder'
          MAGNETIC_ADMIN_KEY: 'placeholder'
          CRON_SECRET: 'placeholder'

      - name: Build (npm)
        if: inputs.build-script != '' && inputs.package-manager == 'npm'
        run: npm run ${{ inputs.build-script }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Test (pnpm)
        if: inputs.test-script != '' && inputs.package-manager == 'pnpm'
        run: pnpm run ${{ inputs.test-script }}

      - name: Test (npm)
        if: inputs.test-script != '' && inputs.package-manager == 'npm'
        run: npm run ${{ inputs.test-script }}

  secret-scan:
    runs-on: ubuntu-latest
    if: inputs.secret-scan
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
